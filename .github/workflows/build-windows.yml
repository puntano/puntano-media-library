name: Build Windows Application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Core Indexing Verification Tests
        run: npm run test:index

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Puntano Media Library v__VERSION__'
          releaseBody: |
            ## What's New in Puntano Media Library v__VERSION__

            ### 🚀 Feature Enhancements
            - **Offline Reverse Geocoding & Place-Name Search**: Built-in global gazetteer with Haversine distance lookup and bounding-box search (search by city, region, or country names such as `"San Luis"`, `"Buenos Aires"`, `"Tokyo"`, `"Japan"` completely offline).
            - **Lightbox Curation, Panning & Slideshow**: Mouse-wheel zoom (`0.5x`–`5x`), click-and-drag panning, double-click zoom toggle, auto-advancing Slideshow (`S` key with `3s`/`4s`/`6s` intervals), in-viewer Favorite (`F`), 1–5 Star Rating (`1`–`5`), Info Inspector (`I`), and Delete (`Delete`).
            - **OS Recycle Bin / Trash Support**: Safe file deletion moving single or batch files to the OS Recycle Bin / Trash (`trash` crate) instead of permanent deletion.
            - **Bulk Duplicate Auto-Clean & Multi-Region Hashing**: One-click **"Keep 1 Copy Per Cluster"** auto-clean in Duplicates Manager, backed by multi-region `xxh3_64` hashing (`512KB` head + `64KB` middle + `64KB` tail + file size).
            - **FFmpeg-Free Video Thumbnails**: Automatic embedded cover extraction and Cinema Filmstrip fallback poster generation when external `ffmpeg` is not installed.

            ### ✨ Workflow & Reliability Improvements
            - **Album Management**: Rename/edit albums, set custom album cover photos, and remove items from albums without deleting media from the library.
            - **Tag Management**: 8-color palette picker when creating tags, plus global tag deletion from the Filter Bar and Inspector.
            - **Date Range Filtering**: Quick date presets (`All Time`, `Last 30 Days`, `This Year`, `Last Year`) and custom `From`/`To` date pickers.
            - **Differential Re-Scan & Watcher Sync**: Skip unchanged files via `(file_path, file_size, modified_at)` pre-check, preserve manual 90° rotations across re-scans, and dynamically register newly added folders with the live filesystem watcher.
            - **RAW Photo Support & Auto-Refreshing Thumbnails**: Included `raw` media in library counters, filters, and lightbox preview; thumbnails update automatically via `"thumbnails-ready"` events.
            - **Map View Sync**: Global filters apply to Map View markers, and clicking **View on Map** flies directly to the selected photo's coordinates.
          releaseDraft: false
          prerelease: false
