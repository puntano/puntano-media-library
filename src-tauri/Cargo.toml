[package]
name = "puntano-media-library"
version = "0.4.1"
description = "High-Performance Cross-Platform Media Library"
authors = ["Puntano Team"]
edition = "2021"

[lib]
name = "puntano_media_library_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
# Tauri Core
tauri = { version = "2.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Serialization & JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# High-Performance SQLite with bundled R*Tree spatial extension (included by default in amalgamation)
rusqlite = { version = "0.32", features = ["bundled"] }

# Multi-threaded concurrent indexing pipeline
walkdir = "2.5"
rayon = "1.10"
tokio = { version = "1", features = ["full"] }
crossbeam-channel = "0.5"

# Fast EXIF and Video ISO BMFF atom parsing
nom-exif = "3.8"

# Ultra-fast hashing
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# Date, Time & Coordinates
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Hardware-accelerated SIMD image downscaling & multi-format decoding
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "gif", "ico", "rayon"] }
fast_image_resize = "6.1"

# Cross-platform live filesystem watcher
notify = "6.1"

# OS Recycle Bin / Trash integration
trash = "5.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

